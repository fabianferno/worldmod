[profile.default]
# The relayed entry points take enough arguments to exhaust the stack
# under the legacy pipeline. via-IR is also what a production deploy
# would use, so testing under it keeps the two consistent.
via_ir = true
optimizer = true
optimizer_runs = 200
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
