# The provenance graph.
#
# product-spec §6.1 claims lineage as a queryable graph — "episode → dataset →
# training run → model" — and demo scene 6 closes on exactly that, queried live.
# This is the shape that makes the claim answerable in one request instead of
# six contract calls and a join done by hand.
#
# Nothing here holds sensor data. §10.2 is explicit that the chain coordinates
# and does not store, so every entity below carries commitments and references:
# hashes, ids, URIs. The video stays where it was uploaded.

# NOT "Entity": graph-ts exports a base class of that name and every generated
# type extends it, so a GraphQL type called Entity compiles to
# `class Entity extends Entity` — a class extending itself, which hangs the
# AssemblyScript compiler with no error at all. §4.1's word is "entity"; the
# type carries a prefix and the meaning is unchanged.
"A contributor or an organization. §4.1 — pseudonymous by default, no PII."
type NetworkEntity @entity(immutable: false) {
  id: Bytes!
  entityType: String!
  metadataURI: String!
  registeredAt: BigInt!
  registeredTx: Bytes!

  assets: [Asset!]! @derivedFrom(field: "owner")
  episodes: [Episode!]! @derivedFrom(field: "contributor")
  payments: [Payment!]! @derivedFrom(field: "account")

  "Running totals, so a leaderboard is a query and not a scan."
  episodeCount: Int!
  acceptedCount: Int!
  totalEarnedUsdc: BigInt!
}

"A registered source of observation. §4.2 — a phone and a robot fleet differ only in capabilities."
type Asset @entity(immutable: false) {
  id: ID!
  owner: NetworkEntity!
  assetType: String!
  "Bitmask; see AssetRegistry's MODALITY_ constants."
  capabilities: Int!
  retired: Boolean!
  registeredAt: BigInt!
  registeredTx: Bytes!

  episodes: [Episode!]! @derivedFrom(field: "asset")
}

"A commitment to one recorded episode. The bytes live off-chain; this is the accountable reference."
type Episode @entity(immutable: false) {
  id: ID!
  contributor: NetworkEntity!
  asset: Asset!
  bountyId: Bytes!
  bounty: Bounty
  manifestHash: Bytes!
  storageURI: String!
  submittedAt: BigInt!
  submittedTx: Bytes!

  validation: Validation
  "Set when a bounty paid for this episode."
  acceptance: Acceptance
  datasets: [DatasetMember!]! @derivedFrom(field: "episode")
}

"What the validator found. §6.3 — a plausibility measure, never a proof of origin."
type Validation @entity(immutable: true) {
  id: ID!
  episode: Episode!
  "Basis points, 0–10000."
  score: Int!
  "self_reported | heuristic | attested | hardware. §6.4."
  trustLevel: String!
  validator: Bytes!
  validatedAt: BigInt!
  tx: Bytes!
}

"A demand-first bounty with its budget escrowed. §7."
type Bounty @entity(immutable: false) {
  id: Bytes!
  buyer: Bytes!
  budgetUsdc: BigInt!
  createdAt: BigInt!
  createdTx: Bytes!

  acceptedCount: Int!
  paidUsdc: BigInt!
  utilitySettled: Boolean!
  utilityDistributedUsdc: BigInt!
  refundedUsdc: BigInt!

  episodes: [Episode!]! @derivedFrom(field: "bounty")
  acceptances: [Acceptance!]! @derivedFrom(field: "bounty")
  utilityAwards: [UtilityAward!]! @derivedFrom(field: "bounty")
}

"One episode paid at the flat per-episode rate."
type Acceptance @entity(immutable: true) {
  id: ID!
  bounty: Bounty!
  episode: Episode!
  contributor: Bytes!
  amountUsdc: BigInt!
  acceptedAt: BigInt!
  tx: Bytes!
}

"A share of a bounty's utility pool, by measured model contribution. §8.3."
type UtilityAward @entity(immutable: true) {
  id: ID!
  bounty: Bounty!
  contributor: Bytes!
  shareBps: Int!
  amountUsdc: BigInt!
  settledAt: BigInt!
  tx: Bytes!
}

"A licensable bundle of episode commitments. §11's RWA object."
type Dataset @entity(immutable: false) {
  id: ID!
  creator: Bytes!
  episodeCount: Int!
  episodesRoot: Bytes!
  mintedAt: BigInt!
  mintedTx: Bytes!

  members: [DatasetMember!]! @derivedFrom(field: "dataset")
  licenses: [License!]! @derivedFrom(field: "dataset")
  licenseCount: Int!
  revenueUsdc: BigInt!
}

"Join between a dataset and an episode — the edge that makes lineage traversable."
type DatasetMember @entity(immutable: true) {
  id: ID!
  dataset: Dataset!
  episode: Episode!
}

type License @entity(immutable: true) {
  id: ID!
  dataset: Dataset!
  buyer: Bytes!
  priceUsdc: BigInt!
  purchasedAt: BigInt!
  tx: Bytes!
}

"A federated training round. §9 — coordination, explicitly not privacy."
type Round @entity(immutable: false) {
  id: ID!
  modelId: Bytes!
  coordinator: Bytes!
  payoutPerParticipantUsdc: BigInt!
  participants: [Bytes!]!
  participantCount: Int!
  openedAt: BigInt!
  openedTx: Bytes!

  status: String!
  globalHash: Bytes
  "Held-out error in basis points; lower is better."
  metricBps: Int
  finalizedAt: BigInt
  finalizedTx: Bytes
  paidUsdc: BigInt!

  updates: [ModelUpdate!]! @derivedFrom(field: "round")
}

"A participant's commitment to the weights they trained locally. The weights never move."
type ModelUpdate @entity(immutable: true) {
  id: ID!
  round: Round!
  participant: Bytes!
  updateHash: Bytes!
  submittedAt: BigInt!
  tx: Bytes!
}

"Money actually withdrawn, from whichever contract held it."
type Payment @entity(immutable: true) {
  id: ID!
  account: NetworkEntity
  accountAddress: Bytes!
  amountUsdc: BigInt!
  source: String!
  withdrawnAt: BigInt!
  tx: Bytes!
}

"One row, so a dashboard can ask for network totals without aggregating client-side."
type Protocol @entity(immutable: false) {
  id: ID!
  entityCount: Int!
  assetCount: Int!
  episodeCount: Int!
  validatedCount: Int!
  datasetCount: Int!
  roundCount: Int!
  totalPaidUsdc: BigInt!
}
