specVersion: 1.0.0
description: >
  World Mod's provenance graph — physical act to episode to dataset to model to
  payment. product-spec §6.1 claims lineage as a queryable graph and demo scene
  6 closes on it; this is what makes that one request rather than six contract
  calls joined by hand.
repository: https://github.com/Ashar20/worldmod
schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: EntityRegistry
    network: sepolia
    source:
      address: "0x5f73D8d846AC9E8d487072f7Bd09af5e4E5c8928"
      abi: EntityRegistry
      startBlock: 11578798
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/entities.ts
      entities: [NetworkEntity, Protocol]
      abis:
        - name: EntityRegistry
          file: ./abis/EntityRegistry.json
      eventHandlers:
        - event: EntityRegistered(indexed address,uint8,string)
          handler: handleEntityRegistered
        - event: EntityUpdated(indexed address,string)
          handler: handleEntityUpdated

  - kind: ethereum
    name: AssetRegistry
    network: sepolia
    source:
      address: "0xd167a52404E546FF1342faf91f6c097568039708"
      abi: AssetRegistry
      startBlock: 11578798
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/assets.ts
      entities: [Asset, NetworkEntity, Protocol]
      abis:
        - name: AssetRegistry
          file: ./abis/AssetRegistry.json
      eventHandlers:
        - event: AssetRegistered(indexed uint256,indexed address,string,uint32)
          handler: handleAssetRegistered
        - event: AssetRetired(indexed uint256)
          handler: handleAssetRetired

  - kind: ethereum
    name: EpisodeRegistry
    network: sepolia
    source:
      address: "0xA5dB7Ad4BcCA2E2a189c257606c4B96AD32b563F"
      abi: EpisodeRegistry
      startBlock: 11578798
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/episodes.ts
      entities: [Episode, Validation, NetworkEntity, Asset, Protocol]
      abis:
        - name: EpisodeRegistry
          file: ./abis/EpisodeRegistry.json
      eventHandlers:
        - event: EpisodeSubmitted(indexed uint256,indexed uint256,indexed address,bytes32)
          handler: handleEpisodeSubmitted
        - event: ValidationRecorded(indexed uint256,uint16,uint8,address)
          handler: handleValidationRecorded

  - kind: ethereum
    name: BountyEscrow
    network: sepolia
    source:
      address: "0x0Be163d4795D77dC8CdB2cAedF08e213ADef27D6"
      abi: BountyEscrow
      startBlock: 11634420
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/bounties.ts
      entities: [Bounty, Acceptance, UtilityAward, Payment, NetworkEntity, Episode, Protocol]
      abis:
        - name: BountyEscrow
          file: ./abis/BountyEscrow.json
      eventHandlers:
        - event: BountyCreated(indexed bytes32,indexed address,uint96)
          handler: handleBountyCreated
        - event: EpisodeAccepted(indexed bytes32,indexed uint256,address,uint96)
          handler: handleEpisodeAccepted
        - event: UtilityPaid(indexed bytes32,indexed address,uint32,uint256)
          handler: handleUtilityPaid
        - event: UtilitySettled(indexed bytes32,uint256)
          handler: handleUtilitySettled
        - event: BountyRefunded(indexed bytes32,indexed address,uint256)
          handler: handleBountyRefunded
        - event: Withdrawn(indexed address,uint256)
          handler: handleWithdrawn

  - kind: ethereum
    name: DatasetRegistry
    network: sepolia
    source:
      address: "0x1df8feDf50394A9e0f78cb0EF8F187D587812cbB"
      abi: DatasetRegistry
      startBlock: 11634706
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/datasets.ts
      entities: [Dataset, DatasetMember, License, Payment, Episode, Protocol]
      abis:
        - name: DatasetRegistry
          file: ./abis/DatasetRegistry.json
      eventHandlers:
        - event: DatasetMinted(indexed uint256,indexed address,uint32,bytes32)
          handler: handleDatasetMinted
        - event: LicensePurchased(indexed uint256,indexed address,uint256)
          handler: handleLicensePurchased
        - event: Withdrawn(indexed address,uint256)
          handler: handleWithdrawn

  - kind: ethereum
    name: FederatedRound
    network: sepolia
    source:
      address: "0x65297C410B96C3604b0A41921e355B24E6cf782e"
      abi: FederatedRound
      startBlock: 11634707
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/federated.ts
      entities: [Round, ModelUpdate, Payment, Protocol]
      abis:
        - name: FederatedRound
          file: ./abis/FederatedRound.json
      eventHandlers:
        - event: RoundOpened(indexed uint256,indexed bytes32,uint32,uint96)
          handler: handleRoundOpened
        - event: UpdateSubmitted(indexed uint256,indexed address,bytes32)
          handler: handleUpdateSubmitted
        - event: RoundFinalized(indexed uint256,bytes32,uint32,uint256)
          handler: handleRoundFinalized
        - event: Withdrawn(indexed address,uint256)
          handler: handleWithdrawn
