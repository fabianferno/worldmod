# ==========================================================================
# CRE SECRETS FILE
# ==========================================================================
# Maps the secret IDs the workflow requests with `runtime.getSecret({ id })`
# to the environment variables holding their values.
#
# In a Confidential Workflow these are released by the Vault DON directly into
# the attested enclave — never exposed in plaintext to node operators or to
# Workflow DON node memory. These two are the bounty's acceptance bar
# (min_framing / min_plausibility): the values World Mod's public API and
# buyer page no longer serve, now confidential end to end.
secretsNames:
    MIN_FRAMING:
        - SECRET_MIN_FRAMING
    MIN_PLAUSIBILITY:
        - SECRET_MIN_PLAUSIBILITY
    # The utility-oracle workflow's secret weighting policy: the exponent applied
    # to each contributor's leave-one-out delta before normalisation. Kept secret
    # so the economic shape of the utility split isn't inferable from the shares
    # that land on-chain.
    UTILITY_GAMMA:
        - SECRET_UTILITY_GAMMA
